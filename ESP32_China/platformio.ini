; ESP32-S3 USB-host bridge for the Maxrays 20x20 mat. Toolchain pinned by the B1 spike (see notes.md).
[platformio]
default_envs = esp32-s3-devkitc-1, esp32-s3-simulate

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    tanakamasayuki/EspUsbHost@2.10.0
    knolleary/PubSubClient@2.8

; Same firmware without USB: publishes a moving 20x20 blob at 10 fps (no mat or breakout needed)
[env:esp32-s3-simulate]
extends = env:esp32-s3-devkitc-1
build_flags = -DSIMULATE_MAT

; Real firmware that also prints the first ~900 raw bytes from the mat as hex (to see why frames do not decode)
[env:esp32-s3-dump]
extends = env:esp32-s3-devkitc-1
build_flags = -DDUMP_RAW

; Host test of the decoder only (needs g++ on PATH): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Isrc
build_src_filter = -<*>
