<!doctype html>
<html lang="nb" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartMat</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint (light unless the user chose dark).
    try { document.documentElement.dataset.theme = localStorage.getItem("sm.theme") === "dark" ? "dark" : "light"; } catch (e) {}
  </script>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="SmartMat">
    <img class="lockup" id="logo" src="img/logo_lockup_light.png" alt="Verdian Medical">
    <img class="mark" id="logoMark" src="img/logo_mark_light.png" alt="Verdian Medical">
  </a>
  <div class="ctl"><span class="ctl-l" id="unitL"></span>
    <select id="unit" data-i-label="unitFilter"><option value="" data-i="allUnits"></option></select>
  </div>
  <div class="ctl"><span class="ctl-l" data-i="sortBy"></span>
    <select id="sort" data-i-label="sortBy">
      <option value="risk" data-i="sortRisk"></option>
      <option value="room" data-i="sortRoom"></option>
      <option value="device" data-i="sortDevice"></option>
      <option value="time" data-i="sortTime"></option>
    </select>
  </div>
  <input id="search" type="search" data-i-ph="searchPh" data-i-label="searchPh" autocomplete="off">
  <span class="grow"></span>
  <button class="icon-btn bell" id="bell" type="button" aria-expanded="false" aria-controls="bellpanel" data-i-title="alerts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>
    <span class="badge" id="badge" hidden></span>
  </button>
  <button class="icon-btn" id="settingsBtn" type="button" data-i-title="settings" data-i-label="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
  </button>
  <button class="icon-btn" id="helpBtn" type="button" data-i-title="help" data-i-label="help">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1 1-1.1 1.8M12 17h.01"/></svg>
  </button>
  <button class="txt-btn" id="langBtn" type="button"></button>
  <button class="icon-btn" id="themeBtn" type="button" data-i-title="theme" data-i-label="theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
  </button>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<section id="bellpanel" class="bellpanel" aria-label="Alerts" hidden>
  <h2 data-i="alerts"></h2>
  <ul id="alertList"></ul>
</section>

<main id="dash" class="layout">
  <section class="panel" id="list" aria-label="Mats">
    <div class="cols" aria-hidden="true">
      <span></span><span data-i="colDevice"></span><span data-i="colRoom"></span><span data-i="colSeat"></span>
      <span data-i="colOk"></span><span data-i="colStatus"></span>
    </div>
    <div id="rows"></div>
    <p class="empty muted" id="empty" hidden></p>
  </section>

  <aside class="panel pm" id="pm" aria-live="off">
    <div class="pm-head">
      <h2 data-i="pressureMap"></h2>
      <span>
        <button class="link only-narrow" id="toList" type="button" data-i="toList"></button>
        <button class="link" id="editBtn" type="button" data-i="edit" hidden></button>
      </span>
    </div>
    <p class="pm-sub" id="pmSub"></p>
    <div id="pmBody" hidden>
      <p class="note bad" id="pmStale" hidden></p>
      <div class="mapbox">
        <div class="front" data-i="front"></div>
        <div class="seat" id="seat"><canvas id="map" width="160" height="160"></canvas></div>
      </div>
      <div class="ramp-row"><span data-i="low"></span><div class="ramp" id="ramp"></div><span data-i="high"></span></div>
      <p class="ramp-unit muted" id="rampUnit"></p>
      <p class="note warn" id="pmSat" hidden></p>
      <p class="note" id="pmUncal" hidden></p>
      <div class="tiles">
        <div class="tile"><div class="v" id="peakV"></div><div class="k" id="peakK"></div></div>
        <div class="tile"><div class="v" id="reliefV"></div><div class="k" data-i="sinceRelief"></div></div>
      </div>
      <details class="more">
        <summary data-i="details"></summary>
        <dl class="kv" id="pmKv"></dl>
        <h3 data-i="hotspots"></h3>
        <dl class="kv" id="pmSpots"></dl>
        <h3 data-i="indices"></h3>
        <dl class="kv" id="pmIdx"></dl>
      </details>
    </div>
  </aside>
</main>

<main id="help" class="panel help" hidden></main>
<main id="settings" class="panel help settings" hidden></main>

<p class="foot" id="foot"></p>

<dialog id="dlg">
  <form id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <div id="dlgFields"></div>
    <label id="pinRow"><span id="pinLabel"></span>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    </label>
    <p class="err" id="dlgErr" role="alert"></p>
    <div class="actions">
      <button class="btn" id="dlgCancel" type="button" data-i="cancel"></button>
      <button class="btn primary" id="dlgOk" type="submit" data-i="ok"></button>
    </div>
  </form>
</dialog>

<dialog id="usersDlg">
  <h2 data-i="users"></h2>
  <ul class="ulist" id="userList"></ul>
  <div class="actions">
    <button class="btn" id="usersClose" type="button" data-i="close"></button>
    <button class="btn primary" id="userAdd" type="button" data-i="addUser"></button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
